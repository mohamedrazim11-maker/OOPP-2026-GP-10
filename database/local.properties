# ==============================================================================
# Faculty Management System (FMS) - Database Configuration
# ==============================================================================
# Supported db.type values:
#   "auto"      - (Default) Auto-detects: tries MySQL (XAMPP) first; falls back to SQL Server (SSMS)
#   "mysql"     - Explicitly connects only to MySQL / MariaDB (XAMPP)
#   "sqlserver" - Explicitly connects only to Microsoft SQL Server (SSMS)
# ==============================================================================
db.type=mysql

# ------------------------------------------------------------------------------
# 1. MySQL (XAMPP / MariaDB) Configuration
# ------------------------------------------------------------------------------
# Default XAMPP settings: port 3306, user 'root', empty password
mysql.url=jdbc:mysql://localhost:3306/faculty_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=2000&socketTimeout=3000
mysql.username=root
mysql.password=

# ------------------------------------------------------------------------------
# 2. Microsoft SQL Server (SSMS / SQLEXPRESS) Configuration
# ------------------------------------------------------------------------------
# Standard SQL Server settings: port 1433 or dynamic port, database 'faculty_management_db'
sqlserver.url=jdbc:sqlserver://localhost:1433;databaseName=faculty_management_db;user=fms_user;password=FmsPass123!;encrypt=true;trustServerCertificate=true;loginTimeout=5;
sqlserver.username=fms_user
sqlserver.password=FmsPass123!
